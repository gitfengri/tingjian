# Nginx vhost for 听见 · AI 智能听写, for a host that already runs Nginx.
# Other sites on this machine are untouched: this is a dedicated server block.
#
# 用法：
#   1) 把 ccc.eliteu.xyz 换成你的域名（共 4 处：两个 server_name + 两个证书路径）
#   2) sudo cp deploy/nginx-existing.conf /etc/nginx/sites-available/<域名>
#      sudo ln -s /etc/nginx/sites-available/<域名> /etc/nginx/sites-enabled/
#   3) sudo nginx -t && sudo systemctl reload nginx
#   4) 证书：sudo certbot --nginx -d <域名>（会自动补齐 ssl_certificate 两行）
#
# 三个关键点：
#   - Host 必须原样透传（$host）。应用会校验请求 Origin 与 Host 一致，
#     若这里改成 127.0.0.1，浏览器请求会被判为跨站并返回 403。
#   - client_max_body_size 要够大：前端允许 12MB 图片，Base64 后约 16MB。
#   - 读超时放大到 300s：图片识别/大模型调用在服务端的上限是 180s。

server {
    listen 80;
    listen [::]:80;
    server_name ccc.eliteu.xyz;

    # Let's Encrypt HTTP-01 校验（webroot 方式需要）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx >= 1.25.1 用这一行；更老的版本改成 listen 443 ssl http2;
    http2 on;
    server_name ccc.eliteu.xyz;

    ssl_certificate     /etc/letsencrypt/live/ccc.eliteu.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ccc.eliteu.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 32m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # 必须是原始 Host，不能写死 127.0.0.1
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
